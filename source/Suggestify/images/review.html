    <style>
        :root {
            --main-color: #203641; /* สีฟ้า */
            --box-bg: #10171f;
            --text-color: #ffffff;
            --nav-height: 60px;
            --space-top: 30px;
        }

        /* General Styles */
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #10171f;
            color: #fff;
        }

        body.light-mode {
            background-color: #f9f9f9;
            color: #121212;
        }

        /* Navigation Menu */
        .nav-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--main-color);
            padding: 0 50px;
            z-index: 1000;
            height: var(--nav-height);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: var(--text-color);
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            padding: 0;
        }

        .nav-menu li {
            margin: 0 10px;
        }

        .nav-menu li a {
            color: var(--text-color);
            font-size: 16px;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease-in-out;
        }

        /* Mobile Menu Toggle */
        .hamburger-menu {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger {
            width: 30px;
            height: 3px;
            background-color: #fff;
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: var(--nav-height);
                right: 0;
                background-color: var(--main-color);
                width: 200px;
                padding: 10px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            }

            .nav-menu.active {
                display: flex;
            }

            .hamburger-menu {
                display: flex;
            }

            .nav-menu li {
                margin: 10px 0;
                text-align: center;
            }
        }

        /* Review Page Styles */
        .review-page {
            max-width: 1200px;
            margin: 100px auto;
            padding: 20px;
            background-color: #10171f;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        body.light-mode .review-page {
            background-color: #fff;
        }

        .drama-description {
            margin-top: 20px;
            font-size: 16px;
            color: #ddd;
        }

        .rating-section, .comment-section {
            margin-top: 20px;
            padding: 20px;
            background-color: #2a2a2a;
            border-radius: 8px;
        }

        body.light-mode .rating-section, body.light-mode .comment-section {
            background-color: #f3f3f3;
        }

        #comments-list .comment {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        body.light-mode #comments-list .comment {
            background-color: #e9e9e9;
        }

        .comment img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .comment .content p {
            margin: 0;
        }

        .vote-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vote-buttons button {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        body.light-mode .vote-buttons button {
            background-color: #ddd;
            color: #000;
        }

        .tags span {
            display: inline-block;
            background-color: #444;
            color: #fff;
            padding: 3px 8px;
            border-radius: 5px;
            margin-right: 5px;
        }

        body.light-mode .tags span {
            background-color: #ddd;
            color: #000;
        }

        #comment-input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            resize: none;
            box-sizing: border-box;
        }

        body.light-mode #comment-input {
            background-color: #f3f3f3;
            color: #000;
        }

        #submit-comment {
            background-color: #007BFF;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        // Function to get the drama name from the URL query parameters
function getDramaFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('drama'); // Returns 'squidGame', 'marryMyHusband', etc.
}

// Dynamically update the page based on the drama name
function loadDramaReview() {
    const dramaName = getDramaFromURL(); // Get the drama from the URL
    const drama = dramaData[dramaName]; // Get the data for the selected drama

    // Populate drama details
    document.getElementById("drama-title").textContent = drama.title;
    document.getElementById("drama-poster").src = drama.poster;
    document.getElementById("drama-description").textContent = drama.description;
    document.getElementById("drama-genres").textContent = drama.genres;
    document.getElementById("drama-trailer").href = drama.trailer;  
    document.getElementById('drama-url').href = drama.streamUrl;
    document.getElementById("drama-review").textContent = drama.review;

// ฟังก์ชันสำหรับโหลดโลโก้ของบริการสตรีมมิ่งที่ถูกต้อง
function loadStreamingServiceLogo(service) {
    const streamLogo = document.getElementById('stream-logo');
    const dramaUrl = document.getElementById('drama-url');

    console.log('Loading streaming service:', service);  // ตรวจสอบการเรียกใช้ฟังก์ชัน

    if (service === 'netflix') {
        streamLogo.src = "./images/logo/Logonetflix.png";  // โลโก้ Netflix
        streamLogo.alt = "Netflix Logo";
        dramaUrl.href = "https://www.netflix.com/title/81040344"; // ลิงก์ Netflix
    } else if (service === 'prime') {
        streamLogo.src = "./images/logo/Prime_Video.png";  // โลโก้ Prime Video
        streamLogo.alt = "Prime Video Logo";
        dramaUrl.href = "https://www.primevideo.com/dp/amzn1.dv.gti.575a83f3-2ef4-4e54-89c7-7a0e15517d33?autoplay=0&ref_=atv_cf_strg_wb";  // ลิงก์ Prime Video สำหรับ "Marry My Husband"
    }
}

    loadStreamingServiceLogo('prime');  // เรียกฟังก์ชันพร้อมระบุว่าใช้ Prime Video
}

    // loadStreamingServiceLogo('netflix');  // ถ้าใช้ Netflix ให้เปลี่ยนเป็น 'netflix'
};


    // Display reviews
    const reviewsList = document.getElementById("comments-list");
    drama.reviews.forEach(review => {
        const reviewDiv = document.createElement("div");
        reviewDiv.classList.add("comment");
        reviewDiv.innerHTML = `<p><strong>${review.author}:</strong> ${review.text}</p>`;
        reviewsList.appendChild(reviewDiv);
    });
    
    // Handle Comment Submission
    const submitButton = document.getElementById('submit-comment');
    const commentInput = document.getElementById('comment-input');
    const totalComments = document.getElementById('total-comments');

    submitButton.addEventListener('click', () => {
        if (commentInput.value) {
            const commentDiv = document.createElement("div");
            commentDiv.classList.add("comment");
            commentDiv.innerHTML = `<p><strong>You:</strong> ${commentInput.value}</p>`;
            reviewsList.appendChild(commentDiv);
            commentInput.value = '';
            totalComments.textContent = reviewsList.children.length;
        }
    });
}
    
// Call the function to load the drama review when the page loads
window.onload = loadDramaReview;
    </script>
